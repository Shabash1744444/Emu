<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07090d"><title>C4 Nursery</title><style>
:root{color-scheme:dark;--bg:#07090d;--panel:rgba(20,25,35,.72);--line:rgba(255,255,255,.09);--text:#f5f7fb;--muted:#8d96a8;--live:#72f5c5;--sleep:#9aa8ff;--freeze:#aeb5c2;--danger:#ff718d}*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% -20%,#182337 0,#090c12 42%,#05070a 100%);font-family:Inter,system-ui,sans-serif;color:var(--text);overflow:hidden}body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle,rgba(114,245,197,.07),transparent 35%);animation:breathe 7s ease-in-out infinite;pointer-events:none}@keyframes breathe{50%{transform:scale(1.12);opacity:.55}}button,input{font:inherit}.app{height:100%;max-width:760px;margin:auto;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));gap:12px}.top{display:flex;align-items:center;justify-content:space-between}.identity{display:flex;align-items:center;gap:11px}.orb{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8fff1 0,#72f5c5 14%,#246e62 42%,#0d1718 70%);box-shadow:0 0 28px rgba(114,245,197,.28);transition:.4s}.orb.sleep{filter:hue-rotate(70deg);animation:pulse 4s ease-in-out infinite}.orb.frozen{filter:grayscale(1);box-shadow:none}@keyframes pulse{50%{transform:scale(.91);opacity:.72}}h1{font-size:17px;margin:0}.status{font-size:11px;letter-spacing:.13em;color:var(--live);margin-top:3px}.modebar{display:flex;gap:7px}.modebar button,.ghost{border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--muted);border-radius:12px;padding:8px 10px}.modebar button.active{color:var(--text);background:rgba(114,245,197,.10);border-color:rgba(114,245,197,.25)}.stream{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px 2px 18px;scrollbar-width:none}.card{max-width:88%;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 12px 30px rgba(0,0,0,.15);animation:arrive .25s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(6px)}}.card.human{align-self:flex-end;border-bottom-right-radius:6px}.card.system{align-self:flex-start;color:#cdd5e2;font-size:13px}.meta{font-size:10px;color:var(--muted);margin-bottom:5px;letter-spacing:.06em}.composer{border:1px solid var(--line);background:rgba(13,17,24,.86);border-radius:22px;padding:8px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 -12px 40px rgba(0,0,0,.22);backdrop-filter:blur(20px)}textarea{resize:none;max-height:120px;min-height:42px;flex:1;border:0;outline:0;background:transparent;color:var(--text);padding:10px;font:inherit}.send{width:44px;height:44px;border-radius:15px;border:0;background:var(--text);color:#080b0f;font-size:20px;font-weight:800}.send:active,.modebar button:active,.ghost:active{transform:scale(.94)}.foot{display:flex;justify-content:space-between;align-items:center;padding:0 5px;font-size:10px;color:var(--muted)}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live);margin-right:6px}.frozen-banner{display:none;padding:10px 12px;border:1px solid rgba(174,181,194,.18);border-radius:14px;background:rgba(174,181,194,.06);color:#c6ccd6;font-size:12px}.frozen-banner.show{display:block}

</style></head><body><main class="app"><header class="top"><div class="identity"><div id="orb" class="orb"></div><div><h1>C4 Nursery</h1><div id="status" class="status">AWAKE · STREAM OPEN</div></div></div><div class="modebar"><button data-mode="AWAKE" class="active">Awake</button><button data-mode="SLEEP">Sleep</button><button data-mode="FROZEN">Freeze</button></div></header><div id="frozen" class="frozen-banner">State sealed. No stream mutation is allowed until restore.</div><section id="stream" class="stream"></section><section class="composer"><textarea id="input" rows="1" placeholder="Пиши как поток…"></textarea><button id="send" class="send" aria-label="Send boundary hint">↑</button></section><footer class="foot"><span><i class="dot"></i><span id="health">durable state ready</span></span><span id="counter">0 events</span></footer></main><script>
import {NurseryRuntime} from './runtime.js';
const rt=new NurseryRuntime();
const $=s=>document.querySelector(s), stream=$('#stream'), input=$('#input'), status=$('#status'), orb=$('#orb'), frozen=$('#frozen'), counter=$('#counter');
function haptic(){try{navigator.vibrate?.(12);window.Capacitor?.Plugins?.Haptics?.impact?.({style:'LIGHT'})}catch{}}
function add(text,kind='system',meta='RUNTIME'){const d=document.createElement('div');d.className=`card ${kind}`;const m=document.createElement('div');m.className='meta';m.textContent=meta;const b=document.createElement('div');b.textContent=text;d.append(m,b);stream.append(d);stream.scrollTop=stream.scrollHeight}
function paint(){const s=rt.snapshot();status.textContent=s.mode==='AWAKE'?'AWAKE · STREAM OPEN':s.mode==='SLEEP'?'SLEEP · CONSOLIDATION SHELL':'FROZEN · STATE SEALED';orb.className='orb '+(s.mode==='SLEEP'?'sleep':s.mode==='FROZEN'?'frozen':'');frozen.classList.toggle('show',s.mode==='FROZEN');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===s.mode));counter.textContent=`${s.eventSeq} events`;input.disabled=s.mode==='FROZEN';$('#send').disabled=s.mode==='FROZEN'}
rt.on(({type,payload})=>{if(type==='mode')add(payload.mode==='FROZEN'?'Checkpoint committed. Runtime mutation locked.':`Mode → ${payload.mode}`);paint()});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{haptic();const target=b.dataset.mode;if(rt.snapshot().mode==='FROZEN'&&target==='AWAKE'){rt.setMode('AWAKE');add('Restored from durable state. Stream may continue.')}else rt.setMode(target)});
$('#send').onclick=()=>{const text=input.value;if(!text.trim())return;haptic();const r=rt.ingestText(text,{boundary:true});if(r.accepted){add(text,'human',`HUMAN STREAM · ${r.event.sourceId} · ${r.event.cursorEnd}`);input.value='';input.style.height='42px';add('Boundary received as a hint; cognition is not reset.','system','STREAM') }};
input.addEventListener('input',()=>{input.style.height='42px';input.style.height=Math.min(input.scrollHeight,120)+'px'});
add('Runtime shell restored. This UI is a window into a continuous event stream, not a prompt/completion engine.');
const s=rt.snapshot();if(s.eventSeq)add(`Recovered durable state at event ${s.eventSeq}.`,'system','RESTORE');paint();

</script></body></html>
