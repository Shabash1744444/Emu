name: Build C4 Nursery APK
on: [workflow_dispatch, push]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: actions/setup-python@v5
     with: {python-version: '3.13'}
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.9'}
   - name: Validate WebView JavaScript syntax
     run: |
      python3 - <<'PY'
      from pathlib import Path
      s=Path('app/src/main/assets/index.html').read_text()
      js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
      Path('/tmp/c4_ui.js').write_text(js)
      PY
      node --check /tmp/c4_ui.js
      python3 - <<'PY'
      import re
      from pathlib import Path
      js=Path('/tmp/c4_ui.js').read_text()
      bad=re.findall(r'(?<!\\$)\\$\\([^;\\n]*?\\)\\.(?:forEach|map|filter)',js)
      if bad:
          raise SystemExit('Single-element $() used as a collection: '+repr(bad))
      PY
      python3 - <<'PY'
      from pathlib import Path
      java=Path('app/src/main/java/com/singularity/c4nursery/MainActivity.java').read_text()
      if 'String lower=us.toLowerCase' in java or 'lower.contains(".c4m")' in java:
          raise SystemExit('Do not validate .c4m using content URI text')
      if 'displayName(u,"organism.c4m")' not in java or 'endsWith(".c4m")' not in java:
          raise SystemExit('Organism picker must validate DISPLAY_NAME')
      PY
      python3 - <<'PY'
      from pathlib import Path
      html=Path('app/src/main/assets/index.html').read_text()
      required=[
          "renderConversation({incoming:true})",
          "renderConversation({forceBottom:true})",
          "mode==='chat-incoming'",
          "keyboardOpen",
          "interactive-widget=resizes-content",
          "id=\"newMsgBadge\"",
      ]
      missing=[x for x in required if x not in html]
      if missing:
          raise SystemExit("Stable-chat contract missing: "+repr(missing))
      start=html.find("function render(){")
      end=html.find("function renderRoomHud()",start)
      block=html[start:end]
      if "m.scrollTop=m.scrollHeight" in block:
          raise SystemExit("Full render must not force chat to bottom")
      PY
      python3 - <<'PY'
      from pathlib import Path
      html=Path('app/src/main/assets/index.html').read_text()
      java=Path('app/src/main/java/com/singularity/c4nursery/MainActivity.java').read_text()
      forbidden=['id="wave"','id="moveBall"','performRoomAction(','ui-room-']
      bad=[x for x in forbidden if x in html]
      if bad:
          raise SystemExit('User puppeteering controls returned: '+repr(bad))
      required=['Тело принадлежит C4','C4_ACTION_REQUEST','WORLD_EVENT','WORLD_TASK','motorStatus','motorLast']
      missing=[x for x in required if x not in html and x not in java]
      if missing:
          raise SystemExit('AI-owned body contract missing: '+repr(missing))
      if '"WAVE","NOD","LOOK_AROUND","STEP_LEFT","STEP_RIGHT","IDLE"' not in java:
          raise SystemExit('Host motor verbs missing')
      PY
      python3 - <<'PY'
      import re
      from pathlib import Path
      html=Path('app/src/main/assets/index.html').read_text()
      bad=re.findall(r"(?<!\\$)\\$\\((['\"])[^'\"]+\\1\\)\\.forEach",html)
      if bad:
          raise SystemExit("Single-element selector used as collection: "+repr(bad))
      required=[
          'Дом Синьки','homeStatusRing','homeThoughtPanel','homeModules',
          'renderHomeDashboard()','data-home-go="chat"','data-home-go="world"',
          'Тело принадлежит C4'
      ]
      missing=[x for x in required if x not in html]
      if missing:
          raise SystemExit("Living Home contract missing: "+repr(missing))
      forbidden=['Эмоции:','Любопытство:','Энергия:','Опыт за сегодня:']
      present=[x for x in forbidden if x in html]
      if present:
          raise SystemExit("Fabricated organism metrics are forbidden: "+repr(present))
      PY
      python3 -m py_compile app/src/main/python/c4_mobile_bridge.py
   - run: set -o pipefail; gradle :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
   - name: Upload build log
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: C4-build-log
      path: /tmp/gradle.log
      if-no-files-found: ignore
   - name: Verify and stage APK
     shell: bash
     run: |
      set -euo pipefail
      APK=app/build/outputs/apk/debug/app-debug.apk
      test -s "$APK"
      unzip -t "$APK"
      mkdir -p release
      cp "$APK" release/C4-Nursery-0.51-living-home.apk
      BYTES=$(stat -c%s release/C4-Nursery-0.51-living-home.apk)
      SHA=$(sha256sum release/C4-Nursery-0.51-living-home.apk | awk '{print $1}')
      test "$BYTES" -gt 10000
      printf 'file=C4-Nursery-0.51-living-home.apk\nbytes=%s\nsha256=%s\n' "$BYTES" "$SHA" | tee release/SHA256.txt
   - uses: actions/upload-artifact@v4
     with:
      name: C4-Nursery-0.51-living-home
      path: |
       release/C4-Nursery-0.51-living-home.apk
       release/SHA256.txt
      if-no-files-found: error
      compression-level: 0
