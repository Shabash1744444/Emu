name: Build C4 Nursery APK
on: [workflow_dispatch, push]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.9'}
   - run: gradle :app:assembleDebug --stacktrace
   - name: Verify and stage APK
     shell: bash
     run: |
      set -euo pipefail
      APK=app/build/outputs/apk/debug/app-debug.apk
      test -s "$APK"
      unzip -t "$APK"
      mkdir -p release
      cp "$APK" release/C4-Nursery-0.41-scene-v2.apk
      BYTES=$(stat -c%s release/C4-Nursery-0.41-scene-v2.apk)
      SHA=$(sha256sum release/C4-Nursery-0.41-scene-v2.apk | awk '{print $1}')
      test "$BYTES" -gt 10000
      printf 'file=C4-Nursery-0.41-scene-v2.apk\nbytes=%s\nsha256=%s\n' "$BYTES" "$SHA" | tee release/SHA256.txt
   - uses: actions/upload-artifact@v4
     with:
      name: C4-Nursery-0.41-scene-v2
      path: |
       release/C4-Nursery-0.41-scene-v2.apk
       release/SHA256.txt
      if-no-files-found: error
      compression-level: 0
