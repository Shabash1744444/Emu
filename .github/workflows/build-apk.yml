name: Build C4 Nursery APK
on: [workflow_dispatch, push]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: actions/setup-python@v5
     with: {python-version: '3.13'}
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.9'}
   - name: Validate WebView JavaScript syntax
     run: |
      python3 - <<'PY'
      from pathlib import Path
      s=Path('app/src/main/assets/index.html').read_text()
      js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
      Path('/tmp/c4_ui.js').write_text(js)
      PY
      node --check /tmp/c4_ui.js
      python3 -m py_compile app/src/main/python/c4_mobile_bridge.py
   - run: set -o pipefail; gradle :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
   - name: Upload build log
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: C4-build-log
      path: /tmp/gradle.log
      if-no-files-found: ignore
   - name: Verify and stage APK
     shell: bash
     run: |
      set -euo pipefail
      APK=app/build/outputs/apk/debug/app-debug.apk
      test -s "$APK"
      unzip -t "$APK"
      mkdir -p release
      cp "$APK" release/C4-Nursery-0.46-embodied-chat.apk
      BYTES=$(stat -c%s release/C4-Nursery-0.46-embodied-chat.apk)
      SHA=$(sha256sum release/C4-Nursery-0.46-embodied-chat.apk | awk '{print $1}')
      test "$BYTES" -gt 10000
      printf 'file=C4-Nursery-0.46-embodied-chat.apk\nbytes=%s\nsha256=%s\n' "$BYTES" "$SHA" | tee release/SHA256.txt
   - uses: actions/upload-artifact@v4
     with:
      name: C4-Nursery-0.46-embodied-chat
      path: |
       release/C4-Nursery-0.46-embodied-chat.apk
       release/SHA256.txt
      if-no-files-found: error
      compression-level: 0
